[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-graph-compiler"
version = "0.1.0"
description = "Optimising compiler for tensor graphs: fusion, memory planning, layout assignment, autotuning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kiruthika Subramani" }]
keywords = ["compiler", "tensor", "fusion", "scheduling", "memory-planning", "autotuning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "torch>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
tgc = "tgc.cli.main:main"

[tool.setuptools.packages.find]
include = ["tgc*"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PL", "RUF"]
ignore = ["PLR0911", "PLR0913", "PLR0915", "PLR2004", "RUF012", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG002", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
